[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-apk-renamer"
dynamic = ["version"]
description = "A focused cross-platform workspace for rebuilding and installing Quest test bundles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RockoTheeHut" }]
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
quest-renamer = "quest_renamer.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quest_renamer = [
  "qml/*.qml",
  "assets/*.svg",
  "assets/patches/**/*.md",
  "assets/patches/**/*.so",
  "resources/*.json",
]

[tool.setuptools.dynamic]
version = { attr = "quest_renamer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["quest_renamer"]
