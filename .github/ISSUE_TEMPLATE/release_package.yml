name: Release download or packaging problem
description: Report a problem with the Windows, macOS, or Linux download
title: "[Release package]: "
labels:
  - bug
body:
  - type: dropdown
    id: version
    attributes:
      label: App version
      description: Choose the release you downloaded.
      options:
        - 1.3.0 (beta 1)
        - 1.2.0 (beta 1 / legacy 1.9.0)
        - 1.1.0 (legacy 1.8.0)
        - Development/source build
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Download
      options:
        - Windows Setup EXE
        - Windows portable ZIP
        - macOS Apple Silicon DMG
        - macOS Intel DMG
        - Linux x86_64 archive
        - Checksum file
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failure stage
      options:
        - Download
        - Checksum verification
        - Installation
        - First launch
        - Upgrade
        - Uninstall
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error message and expected result.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Extra system details
      description: Include the exact OS version and any security warning text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed usernames, private paths, serials, and signing data.
          required: true
