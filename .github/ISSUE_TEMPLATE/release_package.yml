name: Release download or packaging problem
description: Report a problem with the Windows, macOS, or Linux download
title: "[Release package]: "
labels:
  - bug
body:
  - type: dropdown
    id: package
    attributes:
      label: Download
      options:
        - Windows Setup EXE
        - Windows portable ZIP
        - macOS Apple Silicon DMG
        - macOS Intel DMG
        - Linux x86_64 archive
        - Checksum file
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release or tag
      placeholder: "v1.8.0-beta.1"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failure stage
      options:
        - Download
        - Checksum verification
        - Installation
        - First launch
        - Upgrade
        - Uninstall
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error message and expected result.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System details
      description: Include OS version, CPU architecture, and security warning text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed usernames, private paths, serials, and signing data.
          required: true
