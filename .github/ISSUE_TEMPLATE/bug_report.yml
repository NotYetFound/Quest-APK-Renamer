name: Bug report
description: Report a reproducible problem with Quest APK Renamer
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload APKs, OBBs, signing keys, paid game data, headset serials,
        or unsanitized logs.
  - type: dropdown
    id: version
    attributes:
      label: App version
      description: Choose the closest match shown in the app's title bar or About screen.
      options:
        - 1.4.0
        - 1.3.2 (beta 1)
        - 1.3.0 (beta 1)
        - 1.2.0 (beta 1 / legacy 1.9.0)
        - 1.1.0 (legacy 1.8.0)
        - Development/source build
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Other / not sure
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version or Linux distribution
      placeholder: "macOS 15.5, Fedora 44, Ubuntu 24.04, etc."
  - type: input
    id: quest
    attributes:
      label: Quest model
      placeholder: Quest 2, Quest 3, Quest 3S, or not connected
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the stage that failed and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose a folder...
        2. Change the package ID...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Sanitized details log
      description: Remove private paths, game names, serials, and signing data.
      render: text
  - type: checkboxes
    id: authorization
    attributes:
      label: Authorization and privacy
      options:
        - label: I own or am authorized to modify the software involved.
          required: true
        - label: I removed copyrighted game files, secrets, and identifying information.
          required: true
