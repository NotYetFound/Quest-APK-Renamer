name: Feature request
description: Suggest a safe improvement to the desktop workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - All
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe what the user would click and what the app would do.
    validations:
      required: true
