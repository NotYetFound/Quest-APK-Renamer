name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install source and checks
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r packaging/requirements-build.txt -e .
      - name: Validate Python and QML shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src tests scripts
          mypy src
          pytest -q
          quest-renamer --smoke-test
