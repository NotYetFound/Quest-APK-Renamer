name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "quest_apk_renamer.py"
      - "apk_analysis.py"
      - "build_support.py"
      - "build_hooks/**"
      - "tests/**"
      - "assets/**"
      - "resources/**"
      - "tools/**"
      - "vendor/**"
      - "macos/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/releases/**"
      - ".github/workflows/macos-build.yml"

permissions:
  contents: write

env:
  APP_VERSION: "1.3.2"

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: macos/requirements-build.txt

      - name: Validate native architecture
        shell: bash
        run: |
          actual="$(uname -m)"
          if [[ "$actual" != "${{ matrix.arch }}" ]]; then
            echo "Expected ${{ matrix.arch }}, got $actual." >&2
            exit 1
          fi

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          stable_tag="v$APP_VERSION"
          if [[ "$GITHUB_REF_NAME" != "$stable_tag" && "$GITHUB_REF_NAME" != "$stable_tag"-* ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $stable_tag." >&2
            exit 1
          fi

      - name: Import optional Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY_SECRET: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12" ]]; then
            echo "No Developer ID certificate configured; the app will use ad-hoc signing."
            exit 0
          fi
          if [[ -z "$MACOS_CODESIGN_IDENTITY_SECRET" ]]; then
            echo "MACOS_CODESIGN_IDENTITY is required with APPLE_CERTIFICATE_P12." >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/quest-apk-renamer.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          echo "MACOS_CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY_SECRET" >> "$GITHUB_ENV"
          echo "MACOS_BUILD_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build and test
        shell: bash
        env:
          MACOS_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x macos/build.sh macos/bootstrap-dependencies.sh
          ./macos/build.sh

      - name: Notarize when Apple credentials are configured
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="dist/Quest-APK-Renamer-$APP_VERSION-macOS-${{ matrix.arch }}.dmg"
          if [[ -n "${MACOS_CODESIGN_IDENTITY:-}" && -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          else
            echo "Apple notarization credentials are not configured; keeping the ad-hoc/Developer ID build."
          fi

      - name: Upload macOS release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Quest-APK-Renamer-${{ env.APP_VERSION }}-macOS-${{ matrix.arch }}
          path: |
            dist/Quest-APK-Renamer-${{ env.APP_VERSION }}-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_BUILD_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MACOS_BUILD_KEYCHAIN" || true
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download both macOS bundles
        uses: actions/download-artifact@v8
        with:
          pattern: Quest-APK-Renamer-${{ env.APP_VERSION }}-macOS-*
          path: dist
          merge-multiple: true

      - name: Create or update tagged GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          title="Quest APK Renamer ${tag#v}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            release_args=(release create "$tag" --title "$title")
            notes_file="docs/releases/v$APP_VERSION.md"
            if [[ -f "$notes_file" ]]; then
              release_args+=(--notes-file "$notes_file")
            else
              release_args+=(--generate-notes)
            fi
            if [[ "$tag" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            if ! gh "${release_args[@]}"; then
              gh release view "$tag" >/dev/null
            fi
          fi
          gh release upload "$tag" dist/* --clobber
